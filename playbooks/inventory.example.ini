# Example inventory for the documented 192.168.0.0/24 PXE topology.
# Copy to inventory.ini and add SSH/become connection settings securely.

[dns_servers]
pxe01 ansible_host=192.168.0.24

[nginx_servers]
pxe01

[tftp_servers]
pxe01

[iso_servers]
pxe01

[dhcp_servers]
pxe01

[pxe_servers]
pxe01

[nfs_servers]
nfs01 ansible_host=192.168.0.25

[nfs_clients]
pxe01

[ntp_servers]
ntp01 ansible_host=192.168.0.24

[ntp_clients]
pxe01

[nexus_servers]
nexus01 ansible_host=192.168.0.26

[qemu_kvm_servers]
hypervisor01 ansible_host=192.168.0.30
