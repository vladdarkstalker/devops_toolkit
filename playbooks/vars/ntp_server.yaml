---
# Networks whose clients may query this Chrony server.
ntp_server_allowed_networks:
  - 192.168.0.0/24

# Public upstreams used by the internal time server.
ntp_server_upstreams:
  - address: 0.pool.ntp.org
    options: iburst
  - address: 1.pool.ntp.org
    options: iburst
  - address: 2.pool.ntp.org
    options: iburst
