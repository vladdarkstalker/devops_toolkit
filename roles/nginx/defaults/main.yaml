---
# Defaults for the HTTP content server.

# Nginx runtime packages.
nginx_packages:
  - nginx

# HTTP document root and virtual-host listener settings.
nginx_pxe_root: /var/www/html
nginx_pxe_server_name: _
nginx_pxe_listen_port: 80

# Existing site configuration is backed up before replacement.
nginx_backup_path: /opt/backups/nginx
nginx_backup_files:
  - /etc/nginx/sites-available/pxe
