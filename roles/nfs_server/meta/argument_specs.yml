---
argument_specs:
  main:
    short_description: Configure an NFS server export
    options:
      nfs_user:
        type: str
        required: true
      nfs_group:
        type: str
        required: true
      nfs_packages:
        type: list
        elements: str
        required: true
      nfs_shared_folder:
        type: path
        required: true
      nfs_backup_path:
        type: path
        required: true
      nfs_backup_files:
        type: list
        elements: path
        required: true
      nfs_shared_address:
        type: str
        required: true
      nfs_shared_subnet:
        type: int
        required: true
      nfs_shared_access:
        type: str
        required: true
        choices:
          - rw
          - ro
      nfs_sync:
        type: str
        required: true
        choices:
          - sync
          - async
      nfs_secure:
        type: str
        required: true
        choices:
          - secure
          - insecure
      nfs_root_squash:
        type: str
        required: true
        choices:
          - root_squash
          - no_root_squash
      nfs_subtree_check:
        type: str
        required: true
        choices:
          - subtree_check
          - no_subtree_check

