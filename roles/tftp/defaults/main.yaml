---
# Defaults for the standalone TFTP service.

# Ownership of the TFTP configurations.
tftp_user: root
tftp_group: root

# Runtime dependencies.
tftp_packages:
  - tftpd-hpa

# TFTP daemon settings.
tftp_root: /var/lib/tftpboot
tftp_address: 0.0.0.0:69
tftp_options: --secure

# Existing daemon configuration is backed up before replacement.
tftp_backup_path: /opt/backups/tftp
tftp_backup_files:
  - /etc/default/tftpd-hpa
