---
# TFTP role entry point: build firmware, configure publication and start service.

# Refresh APT metadata once per hour on Debian-family systems.
- name: Update repository index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

# Install the TFTP daemon before writing its service defaults.
- name: Installing packages
  ansible.builtin.import_tasks: packages.yaml

# Download and compile the Syslinux BIOS/UEFI firmware required by PXE clients.
- name: Prepare Syslinux bootloaders
  ansible.builtin.import_tasks: syslinux.yaml

# Configure tftpd-hpa to publish the role-managed TFTP root.
- name: Configure TFTP daemon
  ansible.builtin.import_tasks: configuration.yaml

# Copy compiled bootloaders and menu modules into the published tree.
- name: Configure boot firmware
  ansible.builtin.import_tasks: firmware.yaml

# Install the same generated PXELINUX menu for BIOS and UEFI clients.
- name: Configure default boot menu
  ansible.builtin.import_tasks: default_boot.yaml

# Enable tftpd-hpa at boot and ensure it is running now.
- name: Configure service
  ansible.builtin.import_tasks: service.yaml
