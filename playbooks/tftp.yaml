---
# Standalone playbook for TFTP, Syslinux firmware and the PXE boot menu.
- name: Configure standalone TFTP server
  hosts: tftp_servers
  become: true
  gather_facts: true

  # Supplies the HTTP server address embedded into the boot menu.
  vars_files:
    - vars/pxe.yaml

  roles:
    - role: ../roles/tftp
