---
argument_specs:
  main:
    short_description: Configure a Chrony NTP client
    options:
      ntp_client_packages:
        type: list
        elements: str
        required: true
      ntp_client_service_name:
        type: str
        required: true
      ntp_client_config_path:
        type: path
        required: true
      ntp_client_servers:
        type: list
        elements: dict
        required: true
        options:
          address:
            type: str
            required: true
          options:
            type: str
            required: true
      ntp_client_backup_path:
        type: path
        required: true
      ntp_client_backup_files:
        type: list
        elements: path
        required: true

