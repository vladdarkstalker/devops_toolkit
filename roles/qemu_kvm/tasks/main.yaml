---
# QEMU/KVM role entry point.

# Refresh package metadata before installing virtualization components.
- name: Update repository index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

# Install the QEMU, libvirt and optional GUI packages.
- name: Installing packages
  ansible.builtin.import_tasks: packages.yaml

# Enable and start the libvirt management daemon.
- name: Setup libvirt service
  ansible.builtin.import_tasks: service.yaml
