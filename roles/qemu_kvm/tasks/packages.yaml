---
# Package installation and hardware-validation tasks for QEMU/KVM.

# Install the QEMU emulator, firmware and host utilities.
- name: Install QEMU KVM packages
  ansible.builtin.package:
    name: "{{ qemu_kvm_packages }}"
    state: present

# Install libvirt daemons, clients and VM provisioning tools.
- name: Install libvirt packages
  ansible.builtin.package:
    name: "{{ qemu_kvm_libvirt_packages }}"
    state: present

# Install graphical QEMU components only when explicitly enabled.
- name: Install QEMU GUI packages
  ansible.builtin.package:
    name: "{{ qemu_kvm_gui_packages }}"
    state: present
  when: qemu_kvm_install_gui

# Fail when the managed host cannot provide hardware-assisted KVM virtualization.
- name: Check KVM support
  ansible.builtin.command:
    cmd: kvm-ok
  register: qemu_kvm_support
  changed_when: false
  failed_when: qemu_kvm_support.rc != 0
