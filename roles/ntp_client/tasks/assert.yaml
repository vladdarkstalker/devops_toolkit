---
- name: Validate Chrony client platform and time sources
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - ntp_client_packages | length > 0
      - ntp_client_config_path is match('^/')
      - ntp_client_backup_path is match('^/')
      - ntp_client_backup_files | select('match', '^/') | list | length == ntp_client_backup_files | length
      - ntp_client_servers | length > 0
      - ntp_client_servers | map(attribute='address') | select('equalto', '') | list | length == 0
    fail_msg: >-
      Chrony client requires a Debian-family host, absolute paths and at least
      one server with a non-empty address.
