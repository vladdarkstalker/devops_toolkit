---
# Shared PXE topology variables.
# Edit this file before deployment when addresses, network or domain differ.

# Local installation images. ISO files are intentionally excluded from Git.
pxe_boot_entries:
  - name: Ubuntu Server 26.04
    distribution: ubuntu_server
    version: "26.04"
    label: ubuntu_server_2604
    menu_label: Install Ubuntu Server 26.04
    iso_source: distribution/ubuntu_server/ubuntu_server_26.04.iso
    kernel_source: casper/vmlinuz
    initrd_source: casper/initrd
    append: >-
      ip=dhcp boot=casper
      url=http://{{ pxe_http_server }}/ubuntu_server/installer.iso
  - name: Ubuntu Desktop 24.04.3
    distribution: ubuntu_desktop
    version: "24.04.3"
    label: ubuntu_desktop_24043
    menu_label: Install Ubuntu Desktop 24.04.3
    iso_source: distribution/ubuntu_desktop/ubuntu_desktop_24.04.3.iso
    kernel_source: casper/vmlinuz
    initrd_source: casper/initrd
    append: >-
      ip=dhcp boot=casper
      url=http://{{ pxe_http_server }}/ubuntu_desktop/installer.iso
