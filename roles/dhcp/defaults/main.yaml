---
# Default variables for configuring isc-dhcp-server as a PXE DHCP provider.
# Playbooks override topology values from playbooks/vars/pxe.yaml.

# Ownership of the generated DHCP configuration.
dhcp_user: root

dhcp_group: root

# Packages required by the DHCP role.
dhcp_packages:
  - isc-dhcp-server

# Default PXE client network: 192.168.0.0/24.
dhcp_subnet: 192.168.0.0
dhcp_netmask: 255.255.255.0
dhcp_range_start: 192.168.0.100
dhcp_range_end: 192.168.0.200
dhcp_broadcast_address: 192.168.0.255
dhcp_gateway: 192.168.0.1
dhcp_dns_servers:
  - 192.168.0.2
  - 192.168.0.3

# PXE server returned to clients by the DHCP next-server directive.
dhcp_tftp_server: 192.168.0.24

# Empty means that isc-dhcp-server listens on all available IPv4 interfaces.
dhcp_interfacesv4: []

# Destination and source directories used for pre-change backups.
dhcp_backup_path: /opt/backups/dhcp

# dhcp_backup_files:
#   - /etc/dhcp/dhcpd.conf

dhcp_backup_dirs:
  - /etc/dhcp
