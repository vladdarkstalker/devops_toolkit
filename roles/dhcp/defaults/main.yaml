---
# Defaults for ISC DHCP Server.

# Ownership of the generated DHCP configuration.
dhcp_user: root
dhcp_group: root

# Packages required by the DHCP role.
dhcp_packages:
  - isc-dhcp-server

# Backup destination and source directories.
dhcp_backup_path: /opt/backups/dhcp

dhcp_backup_dirs:
  - /etc/dhcp

# Default client network and dynamic address pool.
dhcp_subnet: 192.168.0.0
dhcp_netmask: 255.255.255.0
dhcp_range_start: 192.168.0.100
dhcp_range_end: 192.168.0.200
dhcp_broadcast_address: 192.168.0.255
dhcp_gateway: 192.168.0.1

# DNS servers advertised to DHCP clients.
dhcp_dns_servers:
  - 8.8.8.8
  - 1.1.1.1

# Empty lists leave interface selection unrestricted for that address family.
dhcp_interfacesv4: []
dhcp_interfacesv6: []
