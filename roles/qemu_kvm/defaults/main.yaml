---
# Default packages and feature switches for the QEMU/KVM host role.

qemu_kvm_packages:
  - qemu-system-x86
  - qemu-utils
  - qemu-block-extra
  - ovmf
  - bridge-utils
  - dnsmasq-base
  - cpu-checker

qemu_kvm_install_gui: false

qemu_kvm_gui_packages:
  - qemu-system-gui

qemu_kvm_libvirt_packages:
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst

qemu_kvm_service_name: libvirtd
