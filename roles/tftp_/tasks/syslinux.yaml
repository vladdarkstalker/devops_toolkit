---
# Build Syslinux from source to provide matching BIOS and UEFI PXE firmware.

# Install the compiler, multilib support and headers required by Syslinux.
- name: Install Syslinux build tools
  ansible.builtin.package:
    name: "{{ tftp_syslinux_build_packages }}"
    state: present

# Create the persistent directory holding extracted sources and build outputs.
- name: Create Syslinux installation root
  ansible.builtin.file:
    path: "{{ tftp_syslinux_install_root }}"
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx

# Download the selected source release only when the remote file differs.
- name: Download Syslinux source archive
  ansible.builtin.get_url:
    url: "{{ tftp_syslinux_url }}"
    dest: "{{ tftp_syslinux_download_dir }}/{{ tftp_syslinux_archive }}"
    mode: u=rw,g=r,o=r

# Extract sources once; the Makefile acts as the idempotency marker.
- name: Extract Syslinux sources
  ansible.builtin.unarchive:
    src: "{{ tftp_syslinux_download_dir }}/{{ tftp_syslinux_archive }}"
    dest: "{{ tftp_syslinux_install_root }}"
    remote_src: true
    creates: "{{ syslinux_build_dir }}/Makefile"

# Compile all firmware once; pxelinux.0 marks a completed usable build.
- name: Compile Syslinux
  ansible.builtin.command:
    cmd: make
    chdir: "{{ syslinux_build_dir }}"
    creates: "{{ syslinux_build_dir }}/bios/core/pxelinux.0"
