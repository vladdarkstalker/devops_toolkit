---
# TFTP role entry point: install, back up, configure and start the service.

- name: Validate TFTP role inputs
  ansible.builtin.import_tasks: assert.yaml

# Refresh APT metadata once per hour on Debian-family systems.
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# Install the TFTP daemon before writing its service defaults.
- name: Install TFTP packages
  ansible.builtin.import_tasks: packages.yaml

# Preserve the package-provided daemon defaults through the reusable role.
- name: Back up TFTP configuration
  ansible.builtin.include_role:
    name: backup
  vars:
    backup_destination_path: "{{ tftp_backup_path }}"
    backup_source_files: "{{ tftp_backup_files }}"
    backup_source_directories: []

# Configure tftpd-hpa to publish the role-managed TFTP root.
- name: Configure TFTP daemon
  ansible.builtin.import_tasks: configuration.yaml

# Enable tftpd-hpa at boot and ensure it is running now.
- name: Configure TFTP service
  ansible.builtin.import_tasks: service.yaml
