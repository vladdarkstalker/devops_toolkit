---
# Ensure the publication root exists before content is copied into it.
- name: Create HTTP publication root
  ansible.builtin.file:
    path: "{{ nginx_pxe_root }}"
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx

- name: Install PXE Nginx virtual host
  ansible.builtin.template:
    src: pxe.conf.j2
    dest: /etc/nginx/sites-available/pxe
    owner: root
    group: root
    mode: u=rw,g=r,o=r
  notify: Reload Nginx

- name: Enable PXE Nginx virtual host
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pxe
    dest: /etc/nginx/sites-enabled/pxe
    state: link
  notify: Reload Nginx

- name: Disable default Nginx virtual host
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

# Abort before handlers run if the complete active configuration is invalid.
- name: Validate Nginx configuration
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false
