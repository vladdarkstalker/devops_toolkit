---
argument_specs:
  main:
    short_description: Configure an Nginx content server
    options:
      nginx_packages:
        type: list
        elements: str
        required: true
      nginx_pxe_root:
        type: path
        required: true
      nginx_pxe_server_name:
        type: str
        required: true
      nginx_pxe_listen_port:
        type: int
        required: true
      nginx_backup_path:
        type: path
        required: true
      nginx_backup_files:
        type: list
        elements: path
        required: true

