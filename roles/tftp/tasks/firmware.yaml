---
# Publish compiled Syslinux firmware and modules for BIOS and UEFI x64 clients.

# Create the complete bootloader, configuration and module directory tree.
- name: Create main directories
  ansible.builtin.file:
    path: "{{ tftp_root }}/{{ item }}"
    state: directory
  loop: "{{ tftp_subdirs }}"

# Confirm that compilation produced the BIOS loader before copying any files.
- name: Check Syslinux build directory
  ansible.builtin.stat:
    path: "{{ syslinux_build_dir }}/bios/core/pxelinux.0"
  register: syslinux_bios_bootloader

# Stop with an actionable error instead of producing an incomplete TFTP tree.
- name: Require compiled Syslinux firmware
  ansible.builtin.assert:
    that:
      - syslinux_bios_bootloader.stat.isreg | default(false)
    fail_msg: >-
      Syslinux firmware is missing in {{ syslinux_build_dir }}.
      Check the earlier Syslinux build tasks in the tftp role.

# Copy pxelinux.0 and its mandatory BIOS runtime libraries to the BIOS root.
- name: Copy specific BIOS boot files
  ansible.builtin.copy:
    src: "{{ syslinux_build_dir }}/{{ item }}"
    dest: "{{ tftp_root }}/BIOS/"
    remote_src: true
  loop: "{{ bios_specific_files }}"

# Discover all compiled BIOS menu and utility modules.
- name: Find BIOS .c32 modules
  ansible.builtin.find:
    paths: "{{ syslinux_build_dir }}/bios"
    patterns: "*.c32"
    recurse: true
    file_type: file
  register: bios_c32_modules

# Publish BIOS modules under isolinux/ where the generated menu references them.
- name: Copy BIOS .c32 modules to isolinux
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ tftp_root }}/BIOS/isolinux/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: 'u=rw,go=r'
  loop: "{{ bios_c32_modules.files }}"
  loop_control:
    label: "{{ item.path }}"

# Copy syslinux.efi and its mandatory UEFI x64 runtime libraries.
- name: Copy specific UEFI boot files
  ansible.builtin.copy:
    src: "{{ syslinux_build_dir }}/{{ item }}"
    dest: "{{ tftp_root }}/EFIx64/"
    remote_src: true
  loop: "{{ uefi_specific_files }}"

# Discover all compiled UEFI x64 menu and utility modules.
- name: Find UEFI .c32 modules
  ansible.builtin.find:
    paths: "{{ syslinux_build_dir }}/efi64"
    patterns: "*.c32"
    recurse: true
    file_type: file
  register: uefi_c32_modules

# Publish UEFI modules under isolinux/ for the shared generated menu.
- name: Copy UEFI .c32 modules to isolinux
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ tftp_root }}/EFIx64/isolinux/{{ item.path | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: 'u=rw,go=r'
  loop: "{{ uefi_c32_modules.files }}"
  loop_control:
    label: "{{ item.path }}"
